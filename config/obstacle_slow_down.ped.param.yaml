/**:
  ros__parameters:
    obstacle_slow_down:
      slow_down_planning:
        slow_down_min_acc: -2.0         # (-1.0 upstream: 30 -> 16 km/h took ~25 m, the walker seen 40 m out was reached first)
        slow_down_min_jerk: -1.5        # (-1.0 upstream)

        lpf_gain_slow_down_vel: 0.0 # low-pass filter gain for slow down velocity
        lpf_gain_lateral_distance: 0.8 # low-pass filter gain for lateral distance from obstacle to ego's path
        lpf_gain_dist_to_slow_down: 0.8 # low-pass filter gain for distance to slow down start

        time_margin_on_target_velocity: 1.5 # [s]

        # parameters to calculate slow down velocity by linear interpolation
        object_type_specified_params:
          default:  # values used if not specified for some object type
            left:
              moving:
                min_lat_margin: 0.2
                max_lat_margin: 1.0
                min_ego_velocity: 2.0
                max_ego_velocity: 8.0
              static:
                min_lat_margin: 0.2
                max_lat_margin: 1.0
                min_ego_velocity: 4.0
                max_ego_velocity: 8.0
            right:
              moving:
                min_lat_margin: 0.2
                max_lat_margin: 1.0
                min_ego_velocity: 2.0
                max_ego_velocity: 8.0
              static:
                min_lat_margin: 0.2
                max_lat_margin: 1.0
                min_ego_velocity: 4.0
                max_ego_velocity: 8.0
            wheel_off_track_scale: 0.0 # scale factor for additional stop margin against ego's wheel off-track. Even if this value is set to 0.0, the planner considers the nominal wheel off-track.
          # car.left.moving.min_ego_velocity: 3.0  # example specific override

          # pedestrians: a person within 3 m of the path (standing at the kerb is 1.5-2.5 m) slows the ego to 20 km/h, to 11 km/h
          # close by -- a walker stepping out then needs a short stop (CARLA crossings, 2026-11-03: hits although it was
          # tracked 40 m out; the default 1 m band never saw a kerbside walker)
          # v3 (2026-11-04): 7 km/h close by, 12.6 km/h at 3.5 m -- a child stepping out at the kerb (1.5-2 m) is passed at
          # ~10 km/h (was ~14: children were hit at 12-16 km/h, run_out decided ~2 s after the child set off)
          pedestrian:
            left:
              moving: {min_lat_margin: 0.3, max_lat_margin: 3.5, min_ego_velocity: 2.0, max_ego_velocity: 3.5}
              static: {min_lat_margin: 0.3, max_lat_margin: 3.5, min_ego_velocity: 2.0, max_ego_velocity: 3.5}
            right:
              moving: {min_lat_margin: 0.3, max_lat_margin: 3.5, min_ego_velocity: 2.0, max_ego_velocity: 3.5}
              static: {min_lat_margin: 0.3, max_lat_margin: 3.5, min_ego_velocity: 2.0, max_ego_velocity: 3.5}
            wheel_off_track_scale: 0.0

        moving_object_speed_threshold: 0.5 # [m/s] how fast the object needs to move to be considered as "moving"
        moving_object_hysteresis_range: 0.1 # [m/s] hysteresis range used to prevent chattering when obstacle moves close to moving_object_speed_threshold

      obstacle_filtering:
        object_type:
          unknown: false
          car: true
          truck: true
          bus: true
          trailer: true
          motorcycle: true
          bicycle: true
          pedestrian: true
          pointcloud: false

        # Previously and ideally, the min_lat_margin was 0.
        # However, the objects whose lateral margin is between 0 and 'wheel_off_track_scale times wheel_off_track' are ignored by the obstacle_slow_down module unexpectedly due to the current implementation.
        # Therefore, we set the min_lat_margin to a large negative value temporarily.
        min_lat_margin: -10.0  # lateral margin between obstacle and trajectory band with ego's width to avoid the conflict with the obstacle_stop
        max_lat_margin: 3.6  # (1.1 upstream; 3.6 so the pedestrian band above is reached -- other types keep their 1.0 m bands)
        lat_hysteresis_margin: 0.2
        max_lat_velocity: 3.0 # [m/s] max lateral velocity of obstacle to be considered

        successive_num_to_entry_slow_down_condition: 2   # (5 upstream: 0.5 s before slowing began)
        successive_num_to_exit_slow_down_condition: 20  # (5 upstream: a child lost by the camera for 1 s at 10 m let the car speed up again into it)
