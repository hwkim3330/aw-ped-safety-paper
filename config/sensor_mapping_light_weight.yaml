# Light-weight sensor mapping configuration for Autoware to CARLA
# Reduced-load variant of sensor_mapping.yaml for machines with limited GPU/CPU resources:
#   - Single front camera (CAM_FRONT) with 120 deg FOV at 1080x720, instead of the 6-camera 360 deg setup
#   - Same LiDAR, IMU, and GNSS configuration as sensor_mapping.yaml
# Enable via the `use_light_weight_sensor_mapping` launch argument.

# Default sensor kit to use (must be the _description package containing config/sensor_kit_calibration.yaml)
default_sensor_kit_name: carla_sensor_kit_description

sensor_mappings:
  # LiDAR sensor
  velodyne_top_base_link:
    carla_type: sensor.lidar.ray_cast
    id: top
    ros_config:
      frame_id: velodyne_top
      topic_base: /sensing/lidar/top
      topic_suffix: /pointcloud_before_sync
      frequency_hz: 10
      qos_profile: best_effort
    parameters:
      range: 100
      channels: 64
      # 300000 (the package's) at 20 rotations a second left 234 points per channel a turn (1.5 deg apart, 0.8 m at
      # 30 m): CenterPoint saw a crossing pedestrian only from ~12 m and the car hit it three runs out of three
      # (scenarios.py, 2026-10-30). 1.2 M: 5 stops / 1 near pass / 1 contact in 7 (first seen 12-22 m); a real 64-channel unit is ~1.3 M
      points_per_second: 1200000
      upper_fov: 10.0
      lower_fov: -30.0
      rotation_frequency: 20
      noise_stddev: 0.0

  CAM_FRONT/camera_link:
    carla_type: sensor.camera.rgb
    id: CAM_FRONT
    ros_config:
      frame_id: CAM_FRONT/camera_optical_link
      topic_image: /sensing/camera/CAM_FRONT/image_raw
      topic_info: /sensing/camera/CAM_FRONT/camera_info
      frequency_hz: 10
      qos_profile: reliable
    parameters:
      image_size_x: 1080
      image_size_y: 720
      # 45 (120 in the package's): a 120 deg image put a child 25 m out on ~14 px (YOLOX scored far adults 0.3-0.4 and
      # missed the children: 28 of 29 crossings by a child hit it, 2026-11-04); at 70 deg a child waiting 40-50 m out was
      # still ~15 px and seen in ~10 % of the frames. 45 deg: 4x the pixels of 120; the kerb 3 m to the side is in view
      # from 7 m on, the lidar covers the sides close by. Town01's lanelet map has no traffic lights (nothing else
      # needs the width)
      fov: 45.0
      # CARLA captures a camera on every simulation step unless sensor_tick is set (frequency_hz only drops frames
      # after they crossed the link): 1080x720 BGRA at 20 Hz was ~500 Mbit/s of the ~605 measured on the 1 Gb/s D10
      # path to the Autoware PC (2026-11-02), the EKF fell behind ("Twist queue size exceeded"), trajectories were
      # rejected as too far from the ego and the car left its lane into a guardrail. 10 Hz, what ROS publishes anyway.
      sensor_tick: 0.1

  # IMU sensor
  tamagawa/imu_link:
    carla_type: sensor.other.imu
    id: imu
    ros_config:
      frame_id: tamagawa/imu_link
      topic: /sensing/imu/tamagawa/imu_raw
      frequency_hz: 50
      qos_profile: reliable
    parameters:
      noise_accel_stddev_x: 0.0
      noise_accel_stddev_y: 0.0
      noise_accel_stddev_z: 0.0
      noise_gyro_stddev_x: 0.0
      noise_gyro_stddev_y: 0.0
      noise_gyro_stddev_z: 0.0

  # GNSS sensor
  gnss_link:
    carla_type: sensor.other.gnss
    id: gnss
    ros_config:
      frame_id: map
      topic: /sensing/gnss/pose_with_covariance
      frequency_hz: 2
      qos_profile: reliable
    parameters:
      noise_alt_stddev: 0.0
      noise_lat_stddev: 0.0
      noise_lon_stddev: 0.0
      noise_alt_bias: 0.0
      noise_lat_bias: 0.0
      noise_lon_bias: 0.0
    covariance:
      # Position covariance (variance in meters²)
      position_variance: 0.01 # 0.1m standard deviation
      # Orientation covariance (variance in radians²)
      orientation_variance: 1.0 # Large uncertainty - orientation not measured by GNSS

# Sensor name normalization rules
normalization:
  strip_suffixes:
    - _base_link
    - _link
    - /camera_link

# Enabled sensors list
enabled_sensors:
  # LiDAR
  - velodyne_top_base_link

  # Cameras (6 for 360-degree coverage)
  - CAM_FRONT/camera_link

  # IMU and GNSS
  - tamagawa/imu_link
  - gnss_link
