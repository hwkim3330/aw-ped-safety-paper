# Source: https://github.com/autowarefoundation/autoware_universe/blob/ae18bda943892ecff1c1612382744ae9608b5229/perception/autoware_image_object_locator/config/bbox_object_locator.param.yaml

/**:
  ros__parameters:
    target_frame: "base_link"
    detection_target_class:
      UNKNOWN : false
      CAR : false
      TRUCK : false
      BUS : false
      TRAILER : false
      MOTORCYCLE : false
      BICYCLE : false
      PEDESTRIAN : true
      ANIMAL : false
      HAZARD : false

    roi_confidence_threshold: 0.35 # [0.0, 1.0]  CARLA demo: 0.80 upstream; 0.50 dropped the walkers YOLOX scored 0.31-0.38 at 30-50 m
    roi_truncation_validation:
      enabled: [false, false, false, false, false, false, false, false, false, false]
      remove_truncated: [false, false, false, false, false, false, false, false, false, false]
      image_border_truncation_horizontal_margin_ratio: 0.0 # [0.0, 0.5]
      image_border_truncation_vertical_margin_ratio: 0.0 # [0.0, 0.5]

    # if an object is detected farther than this, it will be filtered out
    detection_max_range: 60.0 # [m]  CARLA demo: 10 upstream (near range only); here the front camera is the far pedestrian sensor (40 until 2026-11-04: a child waiting at the kerb was beyond it for half of its wait)
    # if object height is unavailable, this will be used instead
    pseudo_height: 1.5 # [m]

    pedestrian_detection_config:
      width_min: 0.5 # [m]
      width_max: 0.8 # [m]
